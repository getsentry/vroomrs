name: Changelog Preview
on:
  # pull_request_target so the preview can comment on PRs from forks. The
  # reusable workflow only reads git metadata and .craft.yml and never runs
  # code from the PR.
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    - edited
    - labeled
    - unlabeled
permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  changelog-preview:
    uses: getsentry/craft/.github/workflows/changelog-preview.yml@2e29b0819113d334c15da3d8cac2138cb9dc111a # 3.9.0
    secrets: inherit
